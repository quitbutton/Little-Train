<!-- The Little Steam Train - single-file build, generated by scripts/package-html.mjs -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Little Steam Train</title>

    <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
  overflow: hidden;
  background: #0e1418;
  color: #f6f1e4;
  font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#scene {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
}

#scene.riding {
  cursor: default;
}

#scene.pointing {
  cursor: pointer;
}

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 30px 34px 28px;
  z-index: 5;
}

.top h1 {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: clamp(20px, 2.1vw, 33px);
  font-weight: 600;
  letter-spacing: 0.015em;
  text-shadow: 0 2px 18px rgba(10, 20, 26, 0.55);
}

.top .sub {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  opacity: 0.72;
  text-shadow: 0 2px 14px rgba(10, 20, 26, 0.6);
}

.bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
}

.hint {
  font-size: 13px;
  letter-spacing: 0.02em;
  padding: 9px 15px;
  border-radius: 999px;
  background: rgba(12, 22, 27, 0.42);
  backdrop-filter: blur(9px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  transition: opacity 0.35s ease;
  max-width: 60ch;
}

.buttons {
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

button {
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.03em;
  color: #0f1a1e;
  background: #f4e7c9;
  border: 1px solid rgba(255, 255, 255, 0.5);
  padding: 10px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.16s ease, background 0.16s ease, opacity 0.16s ease;
  box-shadow: 0 8px 24px rgba(8, 16, 20, 0.35);
}

button:hover {
  transform: translateY(-1px);
  background: #fff6e2;
}

button:active {
  transform: translateY(0);
}

button.ghost {
  color: #f6f1e4;
  background: rgba(12, 22, 27, 0.45);
  border-color: rgba(255, 255, 255, 0.24);
  backdrop-filter: blur(9px);
  box-shadow: none;
}

button.ghost:hover {
  background: rgba(20, 34, 40, 0.66);
}

#lyric {
  position: fixed;
  left: 50%;
  bottom: 12%;
  transform: translateX(-50%);
  width: min(86vw, 1400px);
  text-align: center;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: clamp(22px, 3.1vw, 52px);
  line-height: 1.22;
  letter-spacing: 0.01em;
  color: #fff8e8;
  text-shadow: 0 3px 26px rgba(6, 14, 20, 0.85), 0 1px 3px rgba(6, 14, 20, 0.6);
  opacity: 0;
  transition: opacity 0.42s ease;
  pointer-events: none;
  z-index: 6;
}

#lyric.show {
  opacity: 1;
}

#loader {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-size: 13px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  background: #0e1418;
  color: rgba(246, 241, 228, 0.75);
  z-index: 20;
  transition: opacity 0.6s ease;
}

#loader span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #f4e7c9;
  animation: pulse 1.1s ease-in-out infinite;
}

#loader.hidden {
  opacity: 0;
  pointer-events: none;
}

@keyframes pulse {
  0%,
  100% {
    transform: scale(0.6);
    opacity: 0.4;
  }
  50% {
    transform: scale(1);
    opacity: 1;
  }
}

body.capture #hud,
body.capture #loader {
  display: none;
}

#grade {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 6;
  background:
    radial-gradient(125% 105% at 50% 44%, rgba(4, 10, 14, 0) 46%, rgba(4, 10, 14, 0.34) 100%),
    linear-gradient(180deg, rgba(255, 214, 160, 0.05), rgba(24, 48, 72, 0.05) 70%, rgba(8, 14, 18, 0.16));
}

#fade {
  position: fixed;
  inset: 0;
  background: #07090b;
  opacity: 0;
  pointer-events: none;
  z-index: 7;
  display: none;
}

body.capture #fade {
  display: block;
}

body.capture #lyric {
  bottom: 7%;
  font-size: clamp(24px, 2.9vw, 58px);
  transition: none;
}

</style>
